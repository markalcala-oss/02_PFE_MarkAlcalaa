<div class="container my-4">
  <div class="card p-4 shadow-sm mb-4">
    <h3 class="text-primary">{{ modoEdicion ? 'Editar Videojuego (PUT)' : 'Registrar Nuevo Videojuego (POST)' }}</h3>
    <form (ngSubmit)="guardarJuego()">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Título:</label>
          <input type="text" class="form-control" [(ngModel)]="juegoActual.titulo" name="titulo" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Género:</label>
          <input type="text" class="form-control" [(ngModel)]="juegoActual.genero" name="genero" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Plataforma:</label>
          <input type="text" class="form-control" [(ngModel)]="juegoActual.plataforma" name="plataforma">
        </div>
        <div class="col-md-3">
          <label class="form-label">Precio ($):</label>
          <input type="number" class="form-control" [(ngModel)]="juegoActual.precio" name="precio">
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-success me-2">
          {{ modoEdicion ? 'Guardar Cambios' : 'Registrar' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="limpiarFormulario()" *ngIf="modoEdicion">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <div class="card p-4 shadow-sm">
    <h3 class="text-secondary">Listado de Maestros (GET)</h3>
    <table class="table table-striped table-hover mt-3">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Género</th>
          <th>Plataforma</th>
          <th>Precio</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let juego of listaVideojuegos">
          <td>{{ juego.id }}</td>
          <td>{{ juego.titulo }}</td>
          <td>{{ juego.genero }}</td>
          <td>{{ juego.plataforma }}</td>
          <td>${{ juego.precio }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="seleccionarParaEditar(juego)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminarJuego(juego.id)">Eliminar (DELETE)</button>
          </td>
        </tr>
        <tr *ngIf="listaVideojuegos.length === 0">
          <td colspan="6" class="text-center text-muted">No hay registros cargados.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
